<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lab: Structures storybook</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #100e19; /* = ISO_COLORS.sky; the color that follows is ISO_COLORS.ink (src/map/palette-iso.ts); palette-guard.test.ts watches it */ color: #d8d4e8; font: 14px/1.4 system-ui, sans-serif; }
      body { display: grid; grid-template-columns: 14rem 1fr 16rem; }
      #exhibits { overflow-y: auto; padding: 1rem; }
      #exhibits h2 { font-size: 0.8rem; text-transform: uppercase; opacity: 0.6; margin: 1rem 0 0.3rem; }
      #exhibits ul { list-style: none; margin: 0; padding: 0; }
      #exhibits a { color: inherit; text-decoration: none; display: block; padding: 0.15rem 0.4rem; border-radius: 3px; }
      #exhibits a[aria-current="page"] { background: rgba(255, 255, 255, 0.12); }
      #lab-host { min-width: 0; height: 100%; }
      #lab-host:focus-visible { outline-offset: -3px; }
      #lab-host canvas { display: block; }
      #readout { padding: 1rem; overflow-y: auto; }
      #readout dl { margin: 0; }
      #readout dt { font-size: 0.8rem; text-transform: uppercase; opacity: 0.6; margin-top: 0.6rem; }
      #readout dd { margin: 0.1rem 0 0; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <nav id="exhibits" aria-label="Exhibits"></nav>
    <div id="lab-host" role="application" tabindex="0" aria-keyshortcuts="ArrowRight ArrowDown ArrowLeft ArrowUp j k g h a 6" aria-label="Structures storybook: one exhibit at a time. Arrows or j/k change exhibit. Keys g, h and a hide or show ground, shadows and accents. Key 6 rotates the bloom: off, on, fallback."></div>
    <aside id="readout" aria-label="Exhibit readout"></aside>
    <script type="module" src="/src/lab/storybook.ts"></script>
  </body>
</html>
