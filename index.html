<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- los links de #zonas son los controles accesibles sobre los carteles 3D; solo se ocultan si hay JS que los va a colocar (ver #zonas a en style.css) -->
    <script>document.documentElement.classList.add("js");</script>
    <meta name="description" content="Nicolás Riccomini: portfolio, resume y writing." />
    <title>Nicolás Riccomini</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-zone="">
    <div id="app">
      <div id="canvas-host" role="region" tabindex="0" aria-label="Mapa: arrastrá o usá las flechas para recorrerlo">
        <div id="hud" hidden>
          <a id="back" href="/" aria-label="Volver al mapa" title="Volver al mapa"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
        </div>
        <button id="recentrar" type="button" aria-label="Centrar vista" title="Centrar vista" hidden><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></button>
        <p id="titulo" aria-hidden="true">Nicolás Riccomini</p>
        <nav id="zonas" aria-label="Zonas">
          <ul>
            <li><a href="/area/portfolio/" data-zone="portfolio">Portfolio</a></li>
            <li><a href="/area/resume/" data-zone="cv">Resume</a></li>
            <li><a href="/area/blog/" data-zone="blog">Writing</a></li>
          </ul>
        </nav>
      </div>
      <main id="content" hidden></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
