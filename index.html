<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- los rótulos solo se ocultan si hay JS que los va a colocar (ver #zonas a en style.css) -->
    <script>document.documentElement.classList.add("js");</script>
    <meta name="description" content="Nicolás Riccomini: portfolio, resume y blog." />
    <title>Nicolás Riccomini</title>
    <!-- Rubik Doodle Shadow, solo para los rótulos del mapa: recortada (text=) a las letras de Portfolio, Resume y Blog -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&amp;display=swap&amp;text=PORTFOLIESUMBGportfoliesumbg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-zone="">
    <div id="app">
      <div id="canvas-host" aria-label="Mapa">
        <div id="hud" hidden>
          <a id="back" href="/">← Volver al mapa</a>
          <h1 id="zone-title" aria-hidden="true"></h1>
        </div>
        <p id="titulo" aria-hidden="true">Nicolás Riccomini</p>
        <nav id="zonas" aria-label="Zonas">
          <ul>
            <li><a href="/area/portfolio/" data-zone="portfolio">Portfolio</a></li>
            <li><a href="/area/resume/" data-zone="cv">Resume</a></li>
            <li><a href="/area/blog/" data-zone="blog">Blog</a></li>
          </ul>
        </nav>
      </div>
      <main id="content" hidden></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
